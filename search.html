<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">

<script>
(function () {
  try {
    var t = localStorage.getItem('theme');
    if (t !== 'light' && t !== 'dark') {
      t = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
    }
    document.documentElement.setAttribute('data-theme', t);
  } catch (e) {}
})();
</script>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>搜索 · wayione</title>
<link rel="stylesheet" href="assets/site.css">
<style>
  /* 复制首页的基础样式 */
  .search-wrap {
    padding: 40px 0 20px;
    max-width: 720px;
  }
  .search-input-wrap {
    position: relative;
    margin-bottom: 26px;
  }
  .search-input-wrap svg {
    position: absolute;
    left: 16px;
    top: 50%;
    transform: translateY(-50%);
    color: var(--text-dim);
    pointer-events: none;
  }
  #searchInput {
    width: 100%;
    padding: 14px 18px 14px 46px;
    font-size: 15px;
    font-family: inherit;
    border: 1px solid var(--border);
    border-radius: 10px;
    background: var(--bg-solid);
    color: var(--text);
    outline: none;
    transition: all 0.15s;
  }
  #searchInput:focus {
    border-color: var(--accent);
    box-shadow: 0 0 0 3px var(--accent-dim);
  }
  .search-status {
    font-size: 13px;
    color: var(--text-dim);
    margin-bottom: 16px;
  }
  .search-results { display: flex; flex-direction: column; gap: 2px; }
  .result-item {
    display: block;
    padding: 14px 16px;
    border-radius: 8px;
    border: 1px solid transparent;
    text-decoration: none;
    color: inherit;
    transition: all 0.15s;
  }
  .result-item:hover {
    background: var(--bg-elevated);
    border-color: var(--border-soft);
  }
  .result-item .parent {
    font-size: 11px;
    color: var(--text-dim);
    font-family: var(--mono);
    margin-bottom: 3px;
  }
  .result-item h3 {
    font-size: 15px;
    font-weight: 620;
    color: var(--text);
    margin-bottom: 4px;
  }
  .result-item:hover h3 { color: var(--accent); }
  .result-item p {
    font-size: 13px;
    color: var(--text-muted);
    line-height: 1.5;
    margin: 0;
  }
  .empty {
    text-align: center;
    padding: 60px 20px;
    color: var(--text-dim);
    font-size: 14px;
  }
</style>
</head>
<body data-nav="search">

<nav class="nav">
  <div class="nav-inner">
    <a href="index.html" class="nav-logo">
      <span class="dot"></span>
      <span>wayione</span>
    </a>
    <div class="nav-right">
      <a href="index.html">← 返回主页</a>
      <button class="theme-toggle" id="themeToggle" type="button" title="切换深浅色" aria-label="切换深浅色">
        <svg class="icon-sun" viewBox="0 0 24 24" aria-hidden="true">
          <circle cx="12" cy="12" r="4"/>
          <path d="M12 2v2"/>
          <path d="M12 20v2"/>
          <path d="m4.93 4.93 1.41 1.41"/>
          <path d="m17.66 17.66 1.41 1.41"/>
          <path d="M2 12h2"/>
          <path d="M20 12h2"/>
          <path d="m6.34 17.66-1.41 1.41"/>
          <path d="m19.07 4.93-1.41 1.41"/>
        </svg>
        <svg class="icon-moon" viewBox="0 0 24 24" aria-hidden="true">
          <path d="M12 3a6 6 0 0 0 9 9 9 9 0 1 1-9-9Z"/>
        </svg>
      </button>
    </div>
  </div>
</nav>

<div class="layout">
  <aside class="sidebar" id="sidebar"><!-- 复制首页侧栏 --></aside>

  <main class="main">
    <div class="search-wrap">
      <div class="search-input-wrap">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor"
             stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="11" cy="11" r="7"/><path d="m21 21-4.3-4.3"/>
        </svg>
        <input id="searchInput" type="search" placeholder="搜索笔记、标签、关键词…" autofocus>
      </div>
      <div class="search-status" id="searchStatus"></div>
      <div class="search-results" id="searchResults"></div>
    </div>
  </main>
</div>

<script src="https://cdn.jsdelivr.net/npm/fuse.js@7.0.0/dist/fuse.min.js"></script>
<script src="assets/search-index.js"></script>
<script>
(function () {
  'use strict';

  var fuse = new Fuse(window.SEARCH_INDEX, {
    keys: [
      { name: 'title', weight: 0.5 },
      { name: 'parent', weight: 0.2 },
      { name: 'content', weight: 0.3 }
    ],
    threshold: 0.35,
    includeMatches: true,
    minMatchCharLength: 1
  });

  var input = document.getElementById('searchInput');
  var status = document.getElementById('searchStatus');
  var results = document.getElementById('searchResults');

  function highlight(text, query) {
    if (!query) return text;
    var re = new RegExp('(' + query.replace(/[.*+?^${}()|[\]\\]/g, '\\$&') + ')', 'gi');
    return text.replace(re, '<mark style="background:var(--accent-dim);color:var(--accent);padding:0 2px;border-radius:3px;">$1</mark>');
  }

  function render(query) {
    if (!query.trim()) {
      status.textContent = '';
      results.innerHTML = '<div class="empty">输入关键词开始搜索</div>';
      return;
    }
    var found = fuse.search(query).slice(0, 20);
    if (!found.length) {
      status.textContent = '';
      results.innerHTML = '<div class="empty">没有找到与「' + query + '」相关的内容</div>';
      return;
    }
    status.textContent = '找到 ' + found.length + ' 条结果';
    results.innerHTML = found.map(function (r) {
      var item = r.item;
      return '<a class="result-item" href="' + item.url + '">' +
        '<div class="parent">' + item.parent + '</div>' +
        '<h3>' + highlight(item.title, query) + '</h3>' +
        '<p>' + highlight(item.content, query) + '</p>' +
      '</a>';
    }).join('');
  }

  var timer;
  input.addEventListener('input', function () {
    clearTimeout(timer);
    timer = setTimeout(function () { render(input.value); }, 120);
  });

  // URL 参数 ?q=xxx 支持
  var params = new URLSearchParams(location.search);
  if (params.get('q')) {
    input.value = params.get('q');
    render(input.value);
  } else {
    render('');
  }
})();
</script>

<script src="assets/nav-highlight.js"></script>
<script src="assets/site.js"></script>

</body>
</html>
